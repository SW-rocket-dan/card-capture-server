spring:
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect


auth:
  jwt:
    issuer: card-capture
    secret-key: ${JWT_SECRET}
    access-token-expiration: 1h

openai:
  key: ${OPENAI_KEY}

google:
  key: ${GOOGLE_KEY}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    region:
      static: ${S3_REGION}

---

spring:
  config:
    activate:
      on-profile: local

auth:
  jwt:
    access-ttl: 1d

logging:
  level:
    org.springframework.security: DEBUG
